<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040">
  <g id="00_Canvas_Background">
    <rect x="0" y="0" width="1400" height="1040" fill="#E2E8F0" />
    <text x="40" y="38" fill="#0F172A" font-size="16" font-family="sans-serif" font-weight="700">IPV6 Ctrl · 原生 Android (LSPosed) 浅色主屏设计稿 (412×915 dp × 3 · 示例数据)</text>
    <text x="980" y="38" fill="#475569" font-size="13" font-family="sans-serif">直接复制粘贴至 Figma 即可按图层分组编辑</text>
  </g>

  <g id="01_Overview_Light">
    <rect id="ov_frame" x="40" y="62" width="412" height="915" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <g id="ov_statusbar">
      <text x="64" y="88" fill="#0F172A" font-size="12" font-family="sans-serif" font-weight="600">09:41</text>
      <text x="364" y="88" fill="#475569" font-size="11" font-family="sans-serif">5G · 92%</text>
    </g>
    <g id="ov_appbar">
      <text x="60" y="128" fill="#0F172A" font-size="22" font-family="sans-serif" font-weight="700">IPV6 Ctrl</text>
      <text x="60" y="146" fill="#64748B" font-size="11" font-family="sans-serif">桌面独立管理端 · 同 APK 模块 (示例)</text>
      <rect x="376" y="110" width="56" height="32" rx="16" fill="#E2E8F0" />
      <text x="392" y="130" fill="#0F172A" font-size="12" font-family="sans-serif" font-weight="600">设置</text>
    </g>
    <g id="ov_status_card">
      <rect x="56" y="162" width="380" height="142" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="72" y="176" width="148" height="26" rx="13" fill="#CCFBF1" />
      <text x="84" y="193" fill="#0F766E" font-size="12" font-family="sans-serif" font-weight="700">● LSPosed 模块已启用</text>
      <rect x="230" y="176" width="190" height="26" rx="13" fill="#FEF3C7" />
      <text x="242" y="193" fill="#B45309" font-size="12" font-family="sans-serif" font-weight="700">▲ 配置待生效 (需重启目标)</text>
      <rect x="72" y="212" width="168" height="76" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" />
      <text x="84" y="232" fill="#0F766E" font-size="11" font-family="sans-serif" font-weight="600">目标策略 (配置设定)</text>
      <text x="84" y="254" fill="#0F172A" font-size="14" font-family="sans-serif" font-weight="700">按应用接管 IPv6</text>
      <text x="84" y="274" fill="#475569" font-size="11" font-family="sans-serif">已选 3 个应用 (示例)</text>
      <rect x="252" y="212" width="168" height="76" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="264" y="232" fill="#475569" font-size="11" font-family="sans-serif" font-weight="600">实际状态 (检测结果)</text>
      <text x="264" y="254" fill="#0F172A" font-size="14" font-family="sans-serif" font-weight="700">未确认</text>
      <text x="264" y="274" fill="#64748B" font-size="11" font-family="sans-serif">不把目标配置冒充内核状态</text>
    </g>
    <g id="ov_pending_banner">
      <rect x="56" y="314" width="380" height="48" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
      <text x="72" y="335" fill="#92400E" font-size="12" font-family="sans-serif" font-weight="600">策略变更尚未载入目标进程</text>
      <text x="72" y="352" fill="#B45309" font-size="11" font-family="sans-serif">请重启目标应用或系统框架后再运行实际状态检测。</text>
    </g>
    <g id="ov_policy_card">
      <rect x="56" y="374" width="380" height="292" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="72" y="400" fill="#0F172A" font-size="15" font-family="sans-serif" font-weight="700">IPv6 策略切换</text>
      <text x="268" y="400" fill="#64748B" font-size="11" font-family="sans-serif">切换需确认并重启目标进程</text>
      <rect x="72" y="414" width="348" height="72" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5" />
      <text x="88" y="438" fill="#0F766E" font-size="13" font-family="sans-serif" font-weight="700">◉ 仅拦截所选应用 Java 层 AAAA/IPv6</text>
      <text x="88" y="458" fill="#334155" font-size="11" font-family="sans-serif">作用：过滤所选应用 InetAddress IPv6 返回结果</text>
      <text x="88" y="474" fill="#64748B" font-size="11" font-family="sans-serif">恢复：切回默认并强行停止目标应用即可还原</text>
      <rect x="72" y="496" width="348" height="72" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="88" y="520" fill="#0F172A" font-size="13" font-family="sans-serif" font-weight="600">○ 优先 IPv4 (保留 IPv6 兜底)</text>
      <text x="88" y="540" fill="#475569" font-size="11" font-family="sans-serif">作用：调整地址列表排序，优先尝试 IPv4 连接</text>
      <text x="88" y="556" fill="#64748B" font-size="11" font-family="sans-serif">恢复：取消规则后重开应用立即恢复原序</text>
      <rect x="72" y="578" width="348" height="72" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="88" y="602" fill="#0F172A" font-size="13" font-family="sans-serif" font-weight="600">○ 暂停规则 (系统默认直通)</text>
      <text x="88" y="622" fill="#475569" font-size="11" font-family="sans-serif">作用：不执行任何 Hook，保持系统原始网络行为</text>
      <text x="88" y="638" fill="#64748B" font-size="11" font-family="sans-serif">恢复：紧急排障首选，配合重启目标应用生效</text>
    </g>
    <g id="ov_actions_card">
      <rect x="56" y="678" width="380" height="196" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="72" y="704" fill="#0F172A" font-size="14" font-family="sans-serif" font-weight="700">应用操作与异常恢复</text>
      <rect x="72" y="718" width="348" height="44" rx="12" fill="#0F766E" />
      <text x="142" y="745" fill="#FFFFFF" font-size="13" font-family="sans-serif" font-weight="700">保存并重启所选目标进程 (示例)</text>
      <rect x="72" y="772" width="168" height="38" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="104" y="796" fill="#0F172A" font-size="12" font-family="sans-serif" font-weight="600">恢复默认配置</text>
      <rect x="252" y="772" width="168" height="38" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
      <text x="274" y="796" fill="#B91C1C" font-size="12" font-family="sans-serif" font-weight="600">未激活/失败引导预览</text>
      <text x="72" y="832" fill="#64748B" font-size="11" font-family="sans-serif">提示：如未在 LSPosed 勾选本模块，顶部将显示“未激活引导”；</text>
      <text x="72" y="850" fill="#64748B" font-size="11" font-family="sans-serif">涉及系统组件的危险切换均会弹出二次确认并附恢复方法。</text>
    </g>
    <g id="ov_bottom_nav">
      <rect x="40" y="886" width="412" height="91" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="76" y="898" width="84" height="30" rx="15" fill="#CCFBF1" />
      <text x="104" y="918" fill="#0F766E" font-size="12" font-family="sans-serif" font-weight="700">总览</text>
      <text x="222" y="918" fill="#64748B" font-size="12" font-family="sans-serif" font-weight="500">作用范围</text>
      <text x="356" y="918" fill="#64748B" font-size="12" font-family="sans-serif" font-weight="500">诊断</text>
      <rect x="192" y="962" width="108" height="4" rx="2" fill="#94A3B8" />
    </g>
  </g>

  <g id="02_Scope_Light">
    <rect id="sc_frame" x="494" y="62" width="412" height="915" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <g id="sc_statusbar">
      <text x="518" y="88" fill="#0F172A" font-size="12" font-family="sans-serif" font-weight="600">09:41</text>
      <text x="818" y="88" fill="#475569" font-size="11" font-family="sans-serif">5G · 92%</text>
    </g>
    <g id="sc_appbar">
      <text x="514" y="128" fill="#0F172A" font-size="22" font-family="sans-serif" font-weight="700">作用范围</text>
      <text x="514" y="146" fill="#64748B" font-size="11" font-family="sans-serif">目标进程与作用边界说明 · 示例列表</text>
      <rect x="830" y="110" width="56" height="32" rx="16" fill="#E2E8F0" />
      <text x="846" y="130" fill="#0F172A" font-size="12" font-family="sans-serif" font-weight="600">设置</text>
    </g>
    <g id="sc_boundary_card">
      <rect x="510" y="162" width="380" height="106" rx="16" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" />
      <text x="526" y="186" fill="#0F766E" font-size="13" font-family="sans-serif" font-weight="700">作用范围边界声明 (不承诺全链路阻断)</text>
      <text x="526" y="206" fill="#334155" font-size="11" font-family="sans-serif">• 仅展示界面示例，模块仅作用于目标应用 Java/Framework API</text>
      <text x="526" y="224" fill="#334155" font-size="11" font-family="sans-serif">• 不暗示已覆盖 Native/JNI 直连、Vendor 守护进程或 Kernel 路由</text>
      <text x="526" y="242" fill="#0F766E" font-size="11" font-family="sans-serif">• 不承诺“全局零泄漏”或绝对网络隔离；请按需核对实际状态</text>
    </g>
    <g id="sc_filter_bar">
      <rect x="510" y="280" width="112" height="32" rx="16" fill="#0F766E" />
      <text x="528" y="300" fill="#FFFFFF" font-size="12" font-family="sans-serif" font-weight="600">已选目标 (3)</text>
      <rect x="630" y="280" width="118" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="646" y="300" fill="#475569" font-size="12" font-family="sans-serif">普通应用 (示例)</text>
      <rect x="756" y="280" width="134" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="770" y="300" fill="#475569" font-size="12" font-family="sans-serif">系统组件 (需确认)</text>
    </g>
    <g id="sc_target_list">
      <rect x="510" y="324" width="380" height="122" rx="16" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
      <text x="526" y="350" fill="#0F172A" font-size="14" font-family="sans-serif" font-weight="700">☑ 示例浏览器 (com.example.browser)</text>
      <rect x="786" y="332" width="88" height="24" rx="12" fill="#FEF3C7" />
      <text x="798" y="348" fill="#B45309" font-size="11" font-family="sans-serif" font-weight="600">待重启进程</text>
      <text x="526" y="374" fill="#475569" font-size="11" font-family="sans-serif">影响：拦截 Java 层 AAAA 查询；WebView/Native 独立栈可能不受控</text>
      <text x="526" y="392" fill="#64748B" font-size="11" font-family="sans-serif">生效与恢复：需强行停止该应用；取消勾选并重启即恢复原状</text>
      <text x="526" y="416" fill="#0F766E" font-size="11" font-family="sans-serif" font-weight="600">实际状态：未确认 (自上次修改后尚未重启该进程)</text>

      <rect x="510" y="458" width="380" height="122" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="526" y="484" fill="#0F172A" font-size="14" font-family="sans-serif" font-weight="700">☑ 示例同步工具 (org.example.sync)</text>
      <rect x="786" y="466" width="88" height="24" rx="12" fill="#CCFBF1" />
      <text x="798" y="482" fill="#0F766E" font-size="11" font-family="sans-serif" font-weight="600">策略已载入</text>
      <text x="526" y="508" fill="#475569" font-size="11" font-family="sans-serif">影响：优先返回 IPv4 地址；保留 IPv6 备选防断网</text>
      <text x="526" y="526" fill="#64748B" font-size="11" font-family="sans-serif">生效与恢复：进程已重载配置；关闭开关后重启应用可恢复</text>
      <text x="526" y="550" fill="#475569" font-size="11" font-family="sans-serif" font-weight="600">实际状态：Java 层探针已确认 (示例 · 不代表底层网卡状态)</text>

      <rect x="510" y="592" width="380" height="126" rx="16" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
      <text x="526" y="618" fill="#92400E" font-size="14" font-family="sans-serif" font-weight="700">☐ 系统框架 (android · 危险项示例)</text>
      <rect x="774" y="600" width="100" height="24" rx="12" fill="#FEE2E2" />
      <text x="784" y="616" fill="#B91C1C" font-size="11" font-family="sans-serif" font-weight="600">需二次确认</text>
      <text x="526" y="642" fill="#92400E" font-size="11" font-family="sans-serif">影响：作用于系统服务解析，可能导致部分系统组件网络异常</text>
      <text x="526" y="660" fill="#B45309" font-size="11" font-family="sans-serif">生效与恢复：需软重启系统；如异常请在 LSPosed 管理器关闭模块</text>
      <text x="526" y="684" fill="#64748B" font-size="11" font-family="sans-serif" font-weight="600">当前状态：默认未启用 (勾选时弹出风险确认与恢复指引)</text>
    </g>
    <g id="sc_footer_card">
      <rect x="510" y="730" width="380" height="144" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="526" y="756" fill="#0F172A" font-size="13" font-family="sans-serif" font-weight="700">作用域同步与待生效说明</text>
      <text x="526" y="776" fill="#64748B" font-size="11" font-family="sans-serif">新勾选目标需先在 LSPosed 作用域中生效并重启对应应用进程。</text>
      <rect x="526" y="794" width="348" height="42" rx="12" fill="#0F766E" />
      <text x="606" y="820" fill="#FFFFFF" font-size="13" font-family="sans-serif" font-weight="700">应用作用域变更并提示重启目标</text>
      <text x="526" y="856" fill="#64748B" font-size="11" font-family="sans-serif">所有包名与状态均为界面设计示例，非本机真实应用数据。</text>
    </g>
    <g id="sc_bottom_nav">
      <rect x="494" y="886" width="412" height="91" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="558" y="918" fill="#64748B" font-size="12" font-family="sans-serif" font-weight="500">总览</text>
      <rect x="658" y="898" width="92" height="30" rx="15" fill="#CCFBF1" />
      <text x="680" y="918" fill="#0F766E" font-size="12" font-family="sans-serif" font-weight="700">作用范围</text>
      <text x="810" y="918" fill="#64748B" font-size="12" font-family="sans-serif" font-weight="500">诊断</text>
      <rect x="646" y="962" width="108" height="4" rx="2" fill="#94A3B8" />
    </g>
  </g>

  <g id="03_Diagnostics_Light">
    <rect id="dg_frame" x="948" y="62" width="412" height="915" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <g id="dg_statusbar">
      <text x="972" y="88" fill="#0F172A" font-size="12" font-family="sans-serif" font-weight="600">09:41</text>
      <text x="1272" y="88" fill="#475569" font-size="11" font-family="sans-serif">5G · 92%</text>
    </g>
    <g id="dg_appbar">
      <text x="968" y="128" fill="#0F172A" font-size="22" font-family="sans-serif" font-weight="700">诊断</text>
      <text x="968" y="146" fill="#64748B" font-size="11" font-family="sans-serif">分层自检 · 手动刷新 · 脱敏导出 (示例)</text>
      <rect x="1256" y="110" width="84" height="32" rx="16" fill="#CCFBF1" />
      <text x="1274" y="130" fill="#0F766E" font-size="12" font-family="sans-serif" font-weight="700">手动刷新</text>
    </g>
    <g id="dg_timestamp_card">
      <rect x="964" y="162" width="380" height="76" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="980" y="188" fill="#0F172A" font-size="13" font-family="sans-serif" font-weight="700">上次手动检测：示例时间 14:20:08 (非实时)</text>
      <text x="980" y="208" fill="#475569" font-size="11" font-family="sans-serif">严格区分“模块配置已下发”与“目标进程/内核实际状态”。</text>
      <text x="980" y="224" fill="#64748B" font-size="11" font-family="sans-serif">无法直接探测的底层链路一律标记为“未确认”。</text>
    </g>
    <g id="dg_check_cards">
      <rect x="964" y="250" width="380" height="128" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="980" y="276" fill="#0F172A" font-size="14" font-family="sans-serif" font-weight="700">1. 模块连接状态 (LSPosed Bridge)</text>
      <rect x="1244" y="258" width="84" height="24" rx="12" fill="#CCFBF1" />
      <text x="1256" y="274" fill="#0F766E" font-size="11" font-family="sans-serif" font-weight="700">连接正常</text>
      <text x="980" y="302" fill="#475569" font-size="11" font-family="sans-serif">• 模块激活状态：已在 LSPosed 启用 (示例状态)</text>
      <text x="980" y="322" fill="#475569" font-size="11" font-family="sans-serif">• 管理端通信：Binder 配置通道可读可写</text>
      <text x="980" y="342" fill="#64748B" font-size="11" font-family="sans-serif">• 运行方式：按需 Hook，无常驻后台守护进程 (Daemon)</text>

      <rect x="964" y="390" width="380" height="128" rx="16" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" />
      <text x="980" y="416" fill="#0F172A" font-size="14" font-family="sans-serif" font-weight="700">2. 策略下发状态 (Config Delivery)</text>
      <rect x="1232" y="398" width="96" height="24" rx="12" fill="#FEF3C7" />
      <text x="1244" y="414" fill="#B45309" font-size="11" font-family="sans-serif" font-weight="700">待目标重启</text>
      <text x="980" y="442" fill="#475569" font-size="11" font-family="sans-serif">• 目标策略：按应用接管 IPv6 (已下发至模块存储)</text>
      <text x="980" y="462" fill="#B45309" font-size="11" font-family="sans-serif">• 进程同步：1 个示例应用尚未重启，旧配置仍在运行</text>
      <text x="980" y="482" fill="#64748B" font-size="11" font-family="sans-serif">• 处置建议：在总览或系统设置中强行停止目标应用后重试</text>

      <rect x="964" y="530" width="380" height="148" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="980" y="556" fill="#0F172A" font-size="14" font-family="sans-serif" font-weight="700">3. 实际状态检测 (Runtime &amp; Kernel)</text>
      <rect x="1244" y="538" width="84" height="24" rx="12" fill="#F1F5F9" />
      <text x="1264" y="554" fill="#475569" font-size="11" font-family="sans-serif" font-weight="700">未确认</text>
      <text x="980" y="582" fill="#475569" font-size="11" font-family="sans-serif">• 目标进程 Java 解析：未确认 (需目标发起请求后回传)</text>
      <text x="980" y="602" fill="#475569" font-size="11" font-family="sans-serif">• Native / C 层套接字：未确认 (不在本模块拦截范围内)</text>
      <text x="980" y="622" fill="#475569" font-size="11" font-family="sans-serif">• 内核 net.ipv6.conf：未确认 (无内核态权限，不冒充已禁用)</text>
      <text x="980" y="648" fill="#0F766E" font-size="11" font-family="sans-serif" font-weight="600">说明：目标策略 ≠ 实际状态，未完成校验时不显示“已阻断”</text>
