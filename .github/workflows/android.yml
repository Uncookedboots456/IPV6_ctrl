name: Android app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Check runtime on isolated files
        run: |
          shellcheck module/service.sh module/customize.sh module/uninstall.sh scripts/build_runtime.sh
          python3 -m unittest discover -s tests -v
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Rebuild and package Runtime module
        run: |
          cp module/ipv6_daemon "$RUNNER_TEMP/ipv6ctrl-runtime-expected"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" sh scripts/build_runtime.sh
          cmp "$RUNNER_TEMP/ipv6ctrl-runtime-expected" module/ipv6_daemon
          python3 scripts/package_runtime.py
      - name: Check controller and build client
        working-directory: android
        run: |
          sh tests/system_ipv6_test.sh
          sh gradlew --no-daemon onlineTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ipv6-ctrl-runtime-and-client
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/build/runtime/*.zip
          if-no-files-found: error
